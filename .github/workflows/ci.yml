name: CI

on:
  pull_request:

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fixed versions within the ranges package.json allows (`engines` / `devEngines`:
      # Node >= 26, pnpm >= 12), so CI runs are reproducible.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The Chromium that matches the installed Playwright, and its system libraries.
      - run: pnpm --filter @location-scout/web exec playwright install --with-deps chromium
      # Every Data Source answers from recorded fixtures: no test reaches one.
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
